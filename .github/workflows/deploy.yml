name: Deploy Portfolio to Vercel

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Build Check
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Portfolio build successful! Ready to merge → laddtnov.xyz'
            })

  lighthouse:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Lighthouse CI
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@72f881228236981b625ed765b928efb1786a1f55 # v11
        id: lhci
        with:
          configPath: ./json/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Comment Lighthouse scores on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync(`${{ steps.lhci.outputs.resultsPath }}/manifest.json`, 'utf8'));
            const result = manifest.find(r => r.isRepresentativeRun) || manifest[0];
            const scores = result.summary;
            const pct = (x) => Math.round(x * 100);

            const body = `### 🔦 Lighthouse Report

            | Category | Score |
            |---|---|
            | Performance | ${pct(scores.performance)} |
            | Accessibility | ${pct(scores.accessibility)} |
            | Best Practices | ${pct(scores['best-practices'])} |
            | SEO | ${pct(scores.seo)} |
            | PWA | ${pct(scores.pwa)} |

            [Full report](${result.url})`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Deploy to Vercel
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy Portfolio
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel@latest
          vercel deploy --prod --yes

      - name: ✅ Deployment Success
        run: echo "🌐 Portfolio live at laddtnov.xyz"

      - name: ❌ Deployment Failed
        if: failure()
        run: echo "Check logs above"
