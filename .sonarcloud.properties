# SonarQube Cloud — Automatic Analysis configuration.
#
# Automatic Analysis ignores sonar-project.properties; this is the file it reads.
# Only the settings listed in the docs are supported, so keep additions to those.

# Exclude the product pages from copy-paste detection.
#
# Every products/*.html page is a standalone document with no build step behind
# it, so the <head> — canonical, hreflang set, stylesheet links, icon links,
# manifest, theme-color — is necessarily repeated verbatim across all twelve.
# There is no template layer to hoist it into, so CPD reports it as duplication
# that cannot be removed without introducing one. Adding the shared icon block
# in #101 pushed duplication on new code to 84.6% against a 3% gate.
#
# This narrows only the duplication check. All other rules still apply to these
# files.
sonar.cpd.exclusions=products/*.html
