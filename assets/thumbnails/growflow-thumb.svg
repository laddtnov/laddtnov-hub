<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">GrowFlow thumbnail</title>
  <desc id="d">Neon cyberpunk styled finance tracker dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07070b"/>
      <stop offset="100%" stop-color="#0a1a12"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <!-- Outer frame -->
  <rect x="120" y="100" width="960" height="455" rx="18" fill="none" stroke="#00ff88" stroke-width="3" opacity="0.45"/>
  <!-- Bar chart bars -->
  <rect x="200" y="380" width="80" height="120" rx="6" fill="#00ff88" opacity="0.25" stroke="#00ff88" stroke-width="2"/>
  <rect x="320" y="300" width="80" height="200" rx="6" fill="#00ff88" opacity="0.35" stroke="#00ff88" stroke-width="2"/>
  <rect x="440" y="240" width="80" height="260" rx="6" fill="#00ff88" opacity="0.45" stroke="#00ff88" stroke-width="2"/>
  <rect x="560" y="190" width="80" height="310" rx="6" fill="#00ff88" opacity="0.55" stroke="#00ff88" stroke-width="2"/>
  <rect x="680" y="150" width="80" height="350" rx="6" fill="#00ff88" opacity="0.70" stroke="#00ff88" stroke-width="2"/>
  <!-- Trend line -->
  <polyline points="240,400 360,320 480,258 600,208 720,168" fill="none" stroke="#00f2ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <!-- Stat panels right side -->
  <rect x="820" y="150" width="220" height="80" rx="10" fill="#151518" stroke="#00ff88" stroke-width="2" opacity="0.85"/>
  <rect x="820" y="260" width="220" height="80" rx="10" fill="#151518" stroke="#00ff88" stroke-width="2" opacity="0.85"/>
  <rect x="820" y="370" width="220" height="80" rx="10" fill="#151518" stroke="#00f2ff" stroke-width="2" opacity="0.85"/>
  <!-- Baseline -->
  <line x1="180" y1="500" x2="780" y2="500" stroke="#00ff88" stroke-width="1.5" opacity="0.3"/>
  <text x="58" y="614" fill="#00ff88" font-family="'Share Tech Mono', monospace" font-size="56">GROWFLOW</text>
</svg>
