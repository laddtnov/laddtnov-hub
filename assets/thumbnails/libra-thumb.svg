<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">Libra — Book Tracker thumbnail</title>
  <desc id="d">Cyberpunk book tracking interface with open book, bookshelf, and reading statistics panel.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07070b"/>
      <stop offset="100%" stop-color="#0e0a1c"/>
    </linearGradient>
    <filter id="glow-c" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-p" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#00f2ff" stroke-width="0.5" opacity="0.06">
    <line x1="0" y1="84"  x2="1200" y2="84"/>
    <line x1="0" y1="168" x2="1200" y2="168"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="336" x2="1200" y2="336"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="0" y1="588" x2="1200" y2="588"/>
    <line x1="150"  y1="0" x2="150"  y2="675"/>
    <line x1="300"  y1="0" x2="300"  y2="675"/>
    <line x1="450"  y1="0" x2="450"  y2="675"/>
    <line x1="600"  y1="0" x2="600"  y2="675"/>
    <line x1="750"  y1="0" x2="750"  y2="675"/>
    <line x1="900"  y1="0" x2="900"  y2="675"/>
    <line x1="1050" y1="0" x2="1050" y2="675"/>
  </g>

  <!-- Corner brackets -->
  <g stroke="#00f2ff" stroke-width="2" fill="none" opacity="0.35">
    <path d="M24 24 L24 52 M24 24 L52 24"/>
    <path d="M1176 24 L1176 52 M1176 24 L1148 24"/>
    <path d="M24 651 L24 623 M24 651 L52 651"/>
    <path d="M1176 651 L1176 623 M1176 651 L1148 651"/>
  </g>

  <!-- Header -->
  <text x="60" y="74" fill="#00f2ff" font-family="'Courier New',monospace" font-size="50" font-weight="bold" letter-spacing="10" filter="url(#glow-c)">LIBRA</text>
  <text x="65" y="104" fill="#ff00ff" font-family="'Courier New',monospace" font-size="18" letter-spacing="4">&gt; BOOK TRACKER v2.1</text>

  <!-- ── OPEN BOOK ───────────────────────────────── -->
  <!-- Left page -->
  <rect x="272" y="148" width="300" height="340" rx="5" fill="#0d0b1a" stroke="#00f2ff" stroke-width="1.5" opacity="0.95"/>
  <!-- Right page -->
  <rect x="578" y="148" width="300" height="340" rx="5" fill="#0d0b1a" stroke="#00f2ff" stroke-width="1.5" opacity="0.95"/>
  <!-- Book shadow -->
  <rect x="278" y="484" width="594" height="10" rx="5" fill="#00f2ff" opacity="0.08"/>
  <!-- Spine glow -->
  <line x1="576" y1="145" x2="576" y2="490" stroke="#00f2ff" stroke-width="6" opacity="0.3" filter="url(#glow-c)"/>
  <line x1="576" y1="145" x2="576" y2="490" stroke="#00f2ff" stroke-width="2" opacity="1"/>

  <!-- Left page — text lines -->
  <g fill="#d1d1d1" opacity="0.22">
    <rect x="298" y="178" width="248" height="7" rx="3"/>
    <rect x="298" y="198" width="230" height="7" rx="3"/>
    <rect x="298" y="218" width="252" height="7" rx="3"/>
    <rect x="298" y="238" width="210" height="7" rx="3"/>
    <rect x="298" y="258" width="244" height="7" rx="3"/>
    <rect x="298" y="278" width="226" height="7" rx="3"/>
    <rect x="298" y="298" width="250" height="7" rx="3"/>
    <rect x="298" y="318" width="215" height="7" rx="3"/>
    <rect x="298" y="338" width="240" height="7" rx="3"/>
    <rect x="298" y="358" width="228" height="7" rx="3"/>
    <rect x="298" y="378" width="248" height="7" rx="3"/>
    <rect x="298" y="398" width="200" height="7" rx="3"/>
    <rect x="298" y="418" width="235" height="7" rx="3"/>
    <rect x="298" y="438" width="246" height="7" rx="3"/>
    <rect x="298" y="458" width="218" height="7" rx="3"/>
  </g>
  <!-- Highlighted "current" line -->
  <rect x="298" y="318" width="240" height="7" rx="3" fill="#00f2ff" opacity="0.5"/>

  <!-- Right page — text lines -->
  <g fill="#d1d1d1" opacity="0.22">
    <rect x="604" y="178" width="244" height="7" rx="3"/>
    <rect x="604" y="198" width="218" height="7" rx="3"/>
    <rect x="604" y="218" width="240" height="7" rx="3"/>
    <rect x="604" y="238" width="232" height="7" rx="3"/>
    <rect x="604" y="258" width="204" height="7" rx="3"/>
    <rect x="604" y="278" width="248" height="7" rx="3"/>
    <rect x="604" y="298" width="222" height="7" rx="3"/>
    <rect x="604" y="318" width="238" height="7" rx="3"/>
    <rect x="604" y="338" width="210" height="7" rx="3"/>
    <rect x="604" y="358" width="244" height="7" rx="3"/>
    <rect x="604" y="378" width="228" height="7" rx="3"/>
    <rect x="604" y="398" width="200" height="7" rx="3"/>
    <rect x="604" y="418" width="240" height="7" rx="3"/>
    <rect x="604" y="438" width="218" height="7" rx="3"/>
    <rect x="604" y="458" width="238" height="7" rx="3"/>
  </g>

  <!-- Page numbers -->
  <text x="514" y="474" fill="#00f2ff" font-family="monospace" font-size="15" opacity="0.55" text-anchor="middle">142</text>
  <text x="638" y="474" fill="#00f2ff" font-family="monospace" font-size="15" opacity="0.55" text-anchor="middle">143</text>

  <!-- ── STATS PANEL ────────────────────────────── -->
  <rect x="928" y="135" width="224" height="330" rx="10" fill="#0f0d1c" stroke="#ff00ff" stroke-width="1.5" opacity="0.92"/>
  <text x="948" y="168" fill="#ff00ff" font-family="monospace" font-size="15" letter-spacing="3">READING STATS</text>
  <line x1="948" y1="176" x2="1136" y2="176" stroke="#ff00ff" stroke-width="1" opacity="0.35"/>

  <!-- Stat rows -->
  <text x="948" y="208" fill="#888" font-family="monospace" font-size="12" letter-spacing="1">TOTAL READ</text>
  <text x="1136" y="210" fill="#00f2ff" font-family="monospace" font-size="22" font-weight="bold" text-anchor="end" filter="url(#glow-c)">47</text>

  <text x="948" y="244" fill="#888" font-family="monospace" font-size="12" letter-spacing="1">IN PROGRESS</text>
  <text x="1136" y="246" fill="#ff00ff" font-family="monospace" font-size="22" font-weight="bold" text-anchor="end">3</text>

  <text x="948" y="280" fill="#888" font-family="monospace" font-size="12" letter-spacing="1">WISHLIST</text>
  <text x="1136" y="282" fill="#9d00ff" font-family="monospace" font-size="22" font-weight="bold" text-anchor="end">21</text>

  <text x="948" y="316" fill="#888" font-family="monospace" font-size="12" letter-spacing="1">PAGES READ</text>
  <text x="1136" y="318" fill="#00f2ff" font-family="monospace" font-size="22" font-weight="bold" text-anchor="end">14.2k</text>

  <!-- Progress bar: 2024 goal -->
  <text x="948" y="350" fill="#888" font-family="monospace" font-size="12" letter-spacing="1">2024 GOAL</text>
  <rect x="948" y="358" width="164" height="8" rx="4" fill="#1a1824"/>
  <rect x="948" y="358" width="113" height="8" rx="4" fill="#00f2ff" opacity="0.85"/>
  <text x="1136" y="368" fill="#00f2ff" font-family="monospace" font-size="12" text-anchor="end">69%</text>

  <!-- Star rating -->
  <text x="948" y="404" fill="#888" font-family="monospace" font-size="12" letter-spacing="1">AVG RATING</text>
  <text x="948" y="428" fill="#ff00ff" font-family="monospace" font-size="24">&#9733;&#9733;&#9733;&#9733;&#9734;</text>

  <!-- ── BOOKSHELF ───────────────────────────────── -->
  <!-- Shelf plank -->
  <rect x="60" y="572" width="840" height="8" rx="4" fill="#00f2ff" opacity="0.18"/>
  <rect x="60" y="579" width="840" height="3" rx="1.5" fill="#00f2ff" opacity="0.06"/>

  <!-- Book spines — left cluster -->
  <rect x="78"  y="486" width="34" height="88"  rx="3" fill="#ff00ff" opacity="0.78"/>
  <rect x="117" y="472" width="30" height="102" rx="3" fill="#9d00ff" opacity="0.78"/>
  <rect x="152" y="494" width="38" height="80"  rx="3" fill="#00f2ff" opacity="0.65"/>
  <rect x="196" y="476" width="28" height="98"  rx="3" fill="#ff00ff" opacity="0.58"/>
  <rect x="229" y="488" width="42" height="86"  rx="3" fill="#9d00ff" opacity="0.68"/>
  <rect x="277" y="470" width="32" height="104" rx="3" fill="#00f2ff" opacity="0.72"/>

  <!-- gap where open book sits -->

  <!-- Book spines — right cluster -->
  <rect x="620" y="490" width="36" height="84"  rx="3" fill="#ff00ff" opacity="0.62"/>
  <rect x="662" y="474" width="30" height="100" rx="3" fill="#9d00ff" opacity="0.72"/>
  <rect x="697" y="488" width="40" height="86"  rx="3" fill="#00f2ff" opacity="0.62"/>
  <rect x="743" y="468" width="32" height="106" rx="3" fill="#9d00ff" opacity="0.78"/>
  <rect x="781" y="482" width="38" height="92"  rx="3" fill="#ff00ff" opacity="0.68"/>
  <rect x="825" y="476" width="34" height="98"  rx="3" fill="#00f2ff" opacity="0.72"/>

  <!-- Bookmark ribbon on one book (currently reading) -->
  <polygon points="700,474 714,474 714,452 707,460 700,452" fill="#ff00ff" opacity="0.95" filter="url(#glow-p)"/>

  <!-- Bottom label -->
  <text x="60" y="636" fill="#00f2ff" font-family="monospace" font-size="13" opacity="0.4" letter-spacing="4">DIGITAL LIBRARY MANAGEMENT SYSTEM</text>
</svg>
