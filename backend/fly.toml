# fly.toml app configuration file generated for laddtnov-hub-contact on 2026-06-13T23:41:59+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'laddtnov-hub-contact'
primary_region = 'lhr'

[build]

[env]
  ALLOWED_ORIGIN = 'https://laddtnov.xyz'
  PORT = '8080'
  SMTP_HOST = 'smtp.gmail.com'
  SMTP_PORT = '587'
  TO_EMAIL = 'novytskiyvladislav@proton.me'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '5s'
    method = 'GET'
    path = '/healthz'
    protocol = 'http'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
